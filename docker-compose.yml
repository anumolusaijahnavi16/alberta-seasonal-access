services:
  backend:
    image: saijahnavianumolu/alberta-access-backend:latest
    container_name: alberta-backend
    restart: unless-stopped
    ports:
      - "5112:8080"

  frontend:
    image: saijahnavianumolu/alberta-access-frontend:latest
    container_name: alberta-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend